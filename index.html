
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bella Borda Pizzaria</title>
    
    <!-- SEO e Identidade de Domínio -->
    <link rel="canonical" href="https://www.bellaborda.com.br" />
    <meta name="description" content="Peça as melhores pizzas artesanais com bordas recheadas pelo nosso site oficial www.bellaborda.com.br">
    
    <!-- OpenGraph / WhatsApp / Redes Sociais -->
    <meta property="og:site_name" content="Bella Borda Pizzaria">
    <meta property="og:title" content="Bella Borda Pizzaria">
    <meta property="og:description" content="Pizzas artesanais com bordas recheadas irresistíveis. Peça agora pelo nosso site oficial!">
    <meta property="og:url" content="https://www.bellaborda.com.br">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://www.bellaborda.com.br/logo.jpg">
    <meta property="og:image:secure_url" content="https://www.bellaborda.com.br/logo.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="436">
    <meta property="og:image:alt" content="Logomarca Bella Borda Pizzaria">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bella Borda Pizzaria">
    <meta name="twitter:description" content="Pizzas artesanais com bordas recheadas irresistíveis. Peça agora pelo nosso site oficial!">
    <meta name="twitter:image" content="https://www.bellaborda.com.br/logo.jpg">

    <!-- ÍCONES E IDENTIDADE VISUAL -->
    <link id="app-favicon" rel="icon" type="image/png" href="/favicon.png">
    <link id="app-apple-touch-icon" rel="apple-touch-icon" href="/icon-192.png">
    
    <link id="app-manifest" rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#EAB308">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bella Borda">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #f8fafc; margin: 0; min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif; }
        #root { display: flex; flex-direction: column; min-height: 100vh; }
        .initial-loader {
            position: fixed; inset: 0; background: white; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Ajuste do Mapa */
        #delivery-map { height: 300px; width: 100%; border-radius: 20px; z-index: 10; }
    </style>

</head>
<body class="antialiased">
    <div id="initial-loader" class="initial-loader">
        <img id="loader-logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Logo Bella Borda" style="width: 120px; height: 120px; object-contain: contain; animation: pulse 2s infinite ease-in-out;">
    </div>
    <div id="root"></div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            }).catch(function(err) {
                console.log('Service Worker unregistration failed: ', err);
            });
        }
        
        // Safety timeout to remove loader if app fails to load
        setTimeout(function() {
            var loader = document.getElementById('initial-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(function() { loader.remove(); }, 500);
            }
        }, 4000);
    </script>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
