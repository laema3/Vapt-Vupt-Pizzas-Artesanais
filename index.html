    <!-- ÍCONES DINÂMICOS (IDs para manipulação via App.tsx) -->
    <link id="app-favicon" rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3075/3075977.png">
    <link id="app-apple-touch-icon" rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3075/3075977.png">
    
    <link id="app-manifest" rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#EAB308">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VAPT VUPT">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #f8fafc; margin: 0; min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif; }
        #root { display: flex; flex-direction: column; min-height: 100vh; }
        .initial-loader {
            position: fixed; inset: 0; background: white; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Ajuste do Mapa */
        #delivery-map { height: 300px; width: 100%; border-radius: 20px; z-index: 10; }
    </style>

</head>
<body class="antialiased">
    <div id="initial-loader" class="initial-loader">
        <img id="loader-logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Logo VAPT VUPT" style="width: 120px; height: 120px; object-contain: contain; animation: pulse 2s infinite ease-in-out;">
    </div>
    <div id="root"></div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            }).catch(function(err) {
                console.log('Service Worker unregistration failed: ', err);
            });
        }
        
        // Safety timeout to remove loader if app fails to load
        setTimeout(function() {
            var loader = document.getElementById('initial-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(function() { loader.remove(); }, 500);
            }
        }, 4000);
    </script>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
